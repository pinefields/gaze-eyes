<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f1a">
<title>Gaze Eyes</title>
<style>
  /*
   * Gaze Eyes — iPhone Safari 向け「目が人を追う」試作
   *   ① 顔追従: 前面カメラの顔位置へ瞳を向ける（アイコンタクト）
   *   ② 視線推定: 相手がこちらを見ているかを判定し、表情を変える
   * 認識は MediaPipe Face Landmarker（端末内 WASM/WebGL）。映像は外に出ません。
   */
  :root {
    --bg: #0b0f1a;          /* 深い紺。純黒より目が浮きすぎない */
    --bg-soft: #141a2b;
    --sclera: #eef2fb;
    --iris: #3fc8bd;        /* 通常の虹彩 */
    --iris-hot: #8af5e8;    /* 目が合ったとき */
    --pupil: #0a0d16;
    --fg: #d7dcea;
    --muted: #7d86a3;
    --ok: #62d49a;
    --warn: #f0b35c;
    --font: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    --mono: "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #face { position: fixed; inset: 0; display: block; touch-action: none; }
  #cam { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; }

  /* 上部ステータス */
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  #status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(20,26,43,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; letter-spacing: .02em; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .25s; }
  #status.track .dot { background: var(--iris); }
  #status.contact .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  #status.warn .dot { background: var(--warn); }
  #status .fps { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* 下部コントロール */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to top, rgba(11,15,26,.95), rgba(11,15,26,0)); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex: 1 1 140px; min-width: 0; }
  .row label span { white-space: nowrap; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--iris); }
  button { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(215,220,234,.18); background: rgba(20,26,43,.85); color: var(--fg); }
  button:active { background: rgba(63,200,189,.25); }
  button.on { border-color: var(--iris); color: var(--iris-hot); }
  button:focus-visible { outline: 2px solid var(--iris-hot); outline-offset: 2px; }

  /* デバッグ表示 */
  #debug { position: fixed; left: max(10px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 40px); display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  #thumb { width: 108px; height: 144px; border-radius: 10px; background: var(--bg-soft); border: 1px solid rgba(215,220,234,.15); }
  #vals { margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--fg); background: rgba(20,26,43,.78); padding: 8px 10px; border-radius: 10px; min-width: 150px; }
  #vals b { color: var(--muted); font-weight: 500; display: inline-block; width: 4.5em; }
  #log { margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.45; color: var(--muted); background: rgba(20,26,43,.78); padding: 8px 10px; border-radius: 10px; }
  #log .ev { color: var(--fg); }

  /* 開始オーバーレイ */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 24px; text-align: center; background: rgba(11,15,26,.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 5; }
  #start h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .04em; }
  #start p { margin: 0; max-width: 32em; color: var(--muted); font-size: 14px; line-height: 1.7; text-wrap: balance; }
  #start .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #start button.primary { background: var(--iris); color: #06201e; border-color: transparent; font-weight: 600; padding: 12px 22px; font-size: 15px; }
  #start #msg { font-size: 13px; color: var(--warn); min-height: 1.4em; max-width: 34em; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #status .dot { transition: none; } }
</style>
</head>
<body>

<canvas id="face" aria-label="目のアニメーション"></canvas>
<video id="cam" playsinline muted autoplay></video>

<div id="hud"><div id="status"><span class="dot"></span><span id="stText">待機中</span><span class="fps" id="fps"></span></div></div>

<div id="debug" hidden>
  <canvas id="thumb" width="216" height="288"></canvas>
  <div style="display:flex;flex-direction:column;gap:8px">
    <pre id="vals">—</pre>
    <pre id="log"></pre>
  </div>
</div>

<div id="controls">
  <div class="row">
    <label><span>感度</span><input type="range" id="gain" min="0.8" max="4" step="0.1" value="2.2"></label>
    <label><span>上目補正</span><input type="range" id="upBias" min="0" max="0.5" step="0.01" value="0.12"></label>
  </div>
  <div class="row">
    <button id="btnDebug">デバッグ表示</button>
    <button id="btnBlinkSync" class="on">瞬き同期</button>
    <button id="btnTouch">タッチ操作</button>
  </div>
</div>

<div id="start">
  <h1>Gaze Eyes</h1>
  <p>前面カメラで顔を見つけ、瞳がその人を追います。こちらを見ていると判定すると目が笑います。処理はすべて端末内で行い、映像は送信しません。</p>
  <div class="btns">
    <button class="primary" id="btnStart">カメラで開始</button>
    <button id="btnTouchOnly">カメラなしで試す</button>
  </div>
  <div id="msg"></div>
</div>

<script type="module">
/* ========= 設定 ========= */
const MP_VER  = '0.10.14';
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL   = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const DETECT_FPS = 15;             // 認識は間引き（発熱・電池対策）。描画は60fps
const CONTACT_ON_MS  = 300;        // 「見ている」が続いたら目が合ったと判定
const CONTACT_OFF_MS = 600;        // 「見ていない」が続いたら解除
const FACE_LOST_MS   = 1200;       // 顔を見失ってアイドルに入るまで
const SLEEPY_MS      = 20000;      // 誰もいない時間が続くと眠そうに
// 視線判定のしきい値（デバッグ表示の値を見ながら調整）
const TH = { yaw: 18, pitch: 15, gazeX: 0.40, gazeY: 0.35 };

/* ========= DOM ========= */
const $ = s => document.querySelector(s);
const face = $('#face'), ctx = face.getContext('2d');
const cam = $('#cam');
const thumb = $('#thumb'), tctx = thumb.getContext('2d');
const stEl = $('#status'), stText = $('#stText'), fpsEl = $('#fps');
const valsEl = $('#vals'), logEl = $('#log'), msgEl = $('#msg');
const gainEl = $('#gain'), upBiasEl = $('#upBias');

/* ========= 状態 ========= */
const S = {
  target: { x: 0, y: 0 },   // 瞳の目標位置 (-1..1)
  pupil:  { x: 0, y: 0 },   // 現在の瞳位置
  conv: 0, convT: 0,        // 寄り目（距離）
  happy: 0, happyT: 0,      // 下まぶたの笑い
  lidBase: 0,               // 眠さ（常時のまぶた）
  blinkAt: -1, nextBlink: 0,
  faceAt: -1e9,             // 最後に顔を見た時刻
  looking: false, lookSince: 0, notLookSince: 0,
  contact: false,
  touchUntil: 0,            // タッチ操作が優先される期限
  idleNext: 0,
  mode: 'idle',
  vals: null,
  detCount: 0, detFps: 0, detFpsAt: 0,
  blinkSync: true,
};
let landmarker = null, lastDetect = 0, lastT = 0, W = 0, H = 0, wakeLock = null;

/* ========= ユーティリティ ========= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const ease  = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
function setStatus(cls, text) { stEl.className = cls; stText.textContent = text; }
function log(msg) {
  const t = new Date().toTimeString().slice(0, 8);
  const d = document.createElement('div'); d.className = 'ev'; d.textContent = `${t} ${msg}`;
  logEl.prepend(d); while (logEl.children.length > 4) logEl.lastChild.remove();
}
/* 会話アプリ側はこのイベントを拾って Claude へ渡す想定:
   window.addEventListener('gaze', e => console.log(e.detail)) */
function emit(type, extra = {}) {
  window.dispatchEvent(new CustomEvent('gaze', { detail: { type, at: Date.now(), ...extra } }));
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('gaze.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gaze.' + k, JSON.stringify(v)); } catch {} },
};

/* ========= キャンバス ========= */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  face.width = Math.round(W * dpr); face.height = Math.round(H * dpr);
  face.style.width = W + 'px'; face.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

function drawEye(cx, cy, ew, eh, side, now) {
  const ir = ew * 0.30;                                  // 虹彩半径
  const px = (ew / 2 - ir) * 0.92, py = (eh / 2 - ir) * 0.92;
  const ox = px * S.pupil.x + side * S.conv * ew * 0.07;  // side: +1=左目(右へ寄る) -1=右目
  const oy = py * S.pupil.y;
  const hot = S.happy;                                   // 0..1 目が合っている度合い

  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, ew / 2, eh / 2, 0, 0, Math.PI * 2);
  ctx.fillStyle = getCSS('--sclera'); ctx.fill(); ctx.clip();

  // 虹彩
  const irisCol = mix(getCSS('--iris'), getCSS('--iris-hot'), hot);
  const g = ctx.createRadialGradient(cx + ox, cy + oy, ir * 0.2, cx + ox, cy + oy, ir);
  g.addColorStop(0, irisCol); g.addColorStop(1, shade(irisCol, -0.35));
  ctx.shadowColor = irisCol; ctx.shadowBlur = 8 + 22 * hot;
  ctx.beginPath(); ctx.arc(cx + ox, cy + oy, ir * (1 + 0.06 * hot), 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  // 瞳孔
  ctx.beginPath(); ctx.arc(cx + ox, cy + oy, ir * (0.46 - 0.08 * hot), 0, Math.PI * 2);
  ctx.fillStyle = getCSS('--pupil'); ctx.fill();
  // ハイライト
  ctx.beginPath(); ctx.arc(cx + ox - ir * 0.32, cy + oy - ir * 0.36, ir * 0.17, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx + ox + ir * 0.28, cy + oy + ir * 0.30, ir * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();

  // まぶた（上）: 瞬き＋眠さ
  const blink = S.blinkAt >= 0 ? Math.sin(Math.PI * clamp((now - S.blinkAt) / 260, 0, 1)) : 0;
  const lid = clamp(Math.max(S.lidBase, ease(blink)), 0, 1);
  ctx.fillStyle = getCSS('--bg');
  if (lid > 0) {
    ctx.beginPath();
    ctx.moveTo(cx - ew, cy - eh);
    ctx.lineTo(cx + ew, cy - eh);
    ctx.lineTo(cx + ew, cy - eh / 2 + eh * lid * 1.05);
    ctx.quadraticCurveTo(cx, cy - eh / 2 + eh * lid * 1.25, cx - ew, cy - eh / 2 + eh * lid * 1.05);
    ctx.closePath(); ctx.fill();
  }
  // まぶた（下）: 目が合うと弧を描いて持ち上がる＝笑う
  if (hot > 0.01) {
    const rise = eh * 0.95 * hot;
    ctx.beginPath();
    ctx.moveTo(cx - ew, cy + eh);
    ctx.lineTo(cx - ew, cy + eh / 2 + 2);
    ctx.quadraticCurveTo(cx, cy + eh / 2 - rise, cx + ew, cy + eh / 2 + 2);
    ctx.lineTo(cx + ew, cy + eh); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function render(now) {
  ctx.fillStyle = getCSS('--bg'); ctx.fillRect(0, 0, W, H);
  const portrait = H >= W;
  const ew = portrait ? Math.min(W * 0.34, H * 0.2) : Math.min(W * 0.2, H * 0.34);
  const eh = ew * 1.15, gap = ew * 0.42, cy = H * 0.44;
  drawEye(W / 2 - gap / 2 - ew / 2, cy, ew, eh, +1, now);
  drawEye(W / 2 + gap / 2 + ew / 2, cy, ew, eh, -1, now);
}

/* 色ヘルパ（CSS変数→hex→補間） */
const cssCache = {};
function getCSS(name) { return cssCache[name] ??= getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r) { return '#' + r.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); }
function shade(h, k) { const c = hex2rgb(h); return rgb2hex(c.map(v => k < 0 ? v * (1 + k) : v + (255 - v) * k)); }

/* ========= アニメーション更新 ========= */
function update(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016); lastT = now;

  // 瞳: 大きく動くときはサッケード（速く）、小さい動きは滑らかに
  const dist = Math.hypot(S.target.x - S.pupil.x, S.target.y - S.pupil.y);
  const tau = dist > 0.35 ? 0.045 : 0.13;
  const k = 1 - Math.exp(-dt / tau);
  S.pupil.x = lerp(S.pupil.x, S.target.x, k);
  S.pupil.y = lerp(S.pupil.y, S.target.y, k);
  S.conv  = lerp(S.conv,  S.convT,  1 - Math.exp(-dt / 0.25));
  S.happy = lerp(S.happy, S.happyT, 1 - Math.exp(-dt / 0.22));

  // 瞬き
  if (S.blinkAt >= 0 && now - S.blinkAt > 260) S.blinkAt = -1;
  if (S.blinkAt < 0 && now > S.nextBlink) { S.blinkAt = now; S.nextBlink = now + 2500 + Math.random() * 3500; }

  // モード判定
  const touching = now < S.touchUntil;
  const faceSeen = now - S.faceAt < FACE_LOST_MS;
  if (touching) {
    S.mode = 'touch'; S.lidBase = 0; S.happyT = 0;
  } else if (faceSeen) {
    S.mode = S.contact ? 'contact' : 'track'; S.lidBase = 0;
    S.happyT = S.contact ? 1 : 0;
  } else {
    // アイドル: 視線をゆっくり泳がせる
    if (S.mode !== 'idle') { S.mode = 'idle'; S.idleNext = now + 800; S.contact = false; S.looking = false; }
    S.happyT = 0; S.convT = 0;
    if (now > S.idleNext) {
      S.target.x = (Math.random() - 0.5) * 1.1; S.target.y = (Math.random() - 0.5) * 0.7 - 0.05;
      S.idleNext = now + 1400 + Math.random() * 2200;
    }
    S.lidBase = now - S.faceAt > SLEEPY_MS ? 0.45 : 0;
  }
  // ステータス
  const txt = { idle: S.lidBase > 0 ? '誰もいない…（眠い）' : '顔を探しています', track: '追従中', contact: '目が合っています', touch: 'タッチ操作中' }[S.mode];
  const cls = { idle: '', track: 'track', contact: 'contact', touch: 'warn' }[S.mode];
  if (stText.textContent !== txt) setStatus(cls, txt);
}

function frame(now) {
  update(now);
  if (landmarker && cam.readyState >= 2 && now - lastDetect >= 1000 / DETECT_FPS) {
    lastDetect = now;
    try { detect(now); } catch (e) { console.warn(e); }
  }
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ========= 顔認識 → 瞳目標・視線判定 ========= */
function detect(now) {
  const res = landmarker.detectForVideo(cam, performance.now());
  S.detCount++;
  if (now - S.detFpsAt > 1000) { S.detFps = S.detCount; S.detCount = 0; S.detFpsAt = now; fpsEl.textContent = S.detFps + 'fps'; }

  const lm = res.faceLandmarks && res.faceLandmarks[0];
  if (!lm) { S.vals = null; if (!$('#debug').hidden) drawThumb(null); return; }
  S.faceAt = now;

  // --- ① 顔位置 → 瞳目標。前面カメラは鏡像にして「相手がいる側」へ向ける
  const nose = lm[1];
  const fx = (1 - nose.x) - 0.5;      // + = 画面右
  const fy = nose.y - 0.5;            // + = 画面下
  const gain = parseFloat(gainEl.value), upBias = parseFloat(upBiasEl.value);
  if (now >= S.touchUntil) {
    S.target.x = clamp(fx * gain * 2, -1, 1);
    S.target.y = clamp(fy * gain * 2 - upBias, -1, 1);  // カメラは画面上端にあるので少し上目に
  }

  // --- 距離: 変換行列の平行移動z（概ねcm）。無ければ頬幅から推定
  const m = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0] && res.facialTransformationMatrixes[0].data;
  const cheek = Math.hypot(lm[454].x - lm[234].x, lm[454].y - lm[234].y);
  let distCm = m ? Math.abs(m[14]) : (12 / Math.max(cheek, 0.05));
  S.convT = clamp((65 - distCm) / 40, 0, 1);

  // --- 頭の向き（度）。列優先4x4から yaw/pitch を抽出
  let yaw = 0, pitch = 0;
  if (m) {
    yaw   = Math.atan2(m[8], m[10]) * 180 / Math.PI;
    pitch = Math.asin(clamp(-m[9], -1, 1)) * 180 / Math.PI;
  }

  // --- ② 眼球の向き（ブレンドシェイプ 0..1）。Left/Right は相手から見た左右
  const bs = {};
  if (res.faceBlendshapes && res.faceBlendshapes[0]) for (const c of res.faceBlendshapes[0].categories) bs[c.categoryName] = c.score;
  const g = n => bs[n] || 0;
  const gazeX = ((g('eyeLookOutLeft') + g('eyeLookInRight')) - (g('eyeLookInLeft') + g('eyeLookOutRight'))) / 2; // + = 相手の左方向
  const gazeY = ((g('eyeLookUpLeft') + g('eyeLookUpRight')) - (g('eyeLookDownLeft') + g('eyeLookDownRight'))) / 2; // + = 上
  const blink = (g('eyeBlinkLeft') + g('eyeBlinkRight')) / 2;

  // --- 「こちらを見ている」判定（ヒステリシス付き）
  const lookingNow = Math.abs(yaw) < TH.yaw && Math.abs(pitch) < TH.pitch && Math.abs(gazeX) < TH.gazeX && Math.abs(gazeY) < TH.gazeY && blink < 0.6;
  if (lookingNow) { if (!S.looking) { S.looking = true; S.lookSince = now; } }
  else            { if (S.looking)  { S.looking = false; S.notLookSince = now; } }
  if (!S.contact && S.looking && now - S.lookSince > CONTACT_ON_MS) {
    S.contact = true; log('目が合った'); emit('contact', { distCm: Math.round(distCm) });
  } else if (S.contact && !S.looking && now - S.notLookSince > CONTACT_OFF_MS) {
    S.contact = false; log('視線が逸れた'); emit('away');
  }

  // --- 瞬き同期: 相手が瞬いたらこちらも
  if (S.blinkSync && blink > 0.6 && S.blinkAt < 0 && now - (S.lastSyncBlink || 0) > 900) {
    S.blinkAt = now; S.lastSyncBlink = now; S.nextBlink = now + 2500 + Math.random() * 3500;
  }

  S.vals = { fx, fy, distCm, yaw, pitch, gazeX, gazeY, blink, lm };
  if (!$('#debug').hidden) drawThumb(S.vals);
}

/* デバッグ: 鏡像サムネイル＋数値 */
function drawThumb(v) {
  const w = thumb.width, h = thumb.height;
  tctx.save(); tctx.clearRect(0, 0, w, h);
  if (cam.videoWidth) {
    // cover で描画（鏡像）
    const vr = cam.videoWidth / cam.videoHeight, tr = w / h;
    let dw = w, dh = h; if (vr > tr) dw = h * vr; else dh = w / vr;
    tctx.translate(w, 0); tctx.scale(-1, 1);
    tctx.drawImage(cam, (w - dw) / 2, (h - dh) / 2, dw, dh);
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    if (v) {
      const sx = x => w - ((x * dw) + (w - dw) / 2), sy = y => (y * dh) + (h - dh) / 2;
      tctx.fillStyle = '#8af5e8';
      for (const i of [1, 33, 133, 362, 263, 234, 454]) { const p = v.lm[i]; tctx.fillRect(sx(p.x) - 1.5, sy(p.y) - 1.5, 3, 3); }
      // 虹彩
      tctx.fillStyle = '#f0b35c';
      for (const i of [468, 473]) { const p = v.lm[i]; if (p) { tctx.beginPath(); tctx.arc(sx(p.x), sy(p.y), 2.5, 0, 7); tctx.fill(); } }
      // 視線矢印（鏡像なので x 反転）
      const n = v.lm[1], ax = sx(n.x), ay = sy(n.y);
      tctx.strokeStyle = S.contact ? '#62d49a' : '#f0b35c'; tctx.lineWidth = 2;
      tctx.beginPath(); tctx.moveTo(ax, ay); tctx.lineTo(ax - v.gazeX * 60 - Math.sin(v.yaw * Math.PI / 180) * 40, ay - v.gazeY * 60 - Math.sin(v.pitch * Math.PI / 180) * 40); tctx.stroke();
    }
  }
  tctx.restore();
  valsEl.innerHTML = v ? [
    ['顔x,y', `${v.fx.toFixed(2)}, ${v.fy.toFixed(2)}`],
    ['距離', `${v.distCm.toFixed(0)} cm`],
    ['頭yaw', `${v.yaw.toFixed(0)}°`], ['頭pitch', `${v.pitch.toFixed(0)}°`],
    ['視線x', v.gazeX.toFixed(2)], ['視線y', v.gazeY.toFixed(2)],
    ['瞬き', v.blink.toFixed(2)],
    ['判定', S.contact ? '目が合っている' : (S.looking ? '見ている→' : '見ていない')],
  ].map(([k, s]) => `<b>${k}</b>${s}`).join('\n') : '顔なし';
}

/* ========= タッチ操作（カメラなしでも目を動かせる） ========= */
function onPointer(e) {
  const r = face.getBoundingClientRect();
  S.target.x = clamp(((e.clientX - r.left) / r.width - 0.5) * 2.2, -1, 1);
  S.target.y = clamp(((e.clientY - r.top) / r.height - 0.5) * 2.2, -1, 1);
  S.touchUntil = performance.now() + 1500;
}
face.addEventListener('pointerdown', e => { onPointer(e); face.setPointerCapture(e.pointerId); });
face.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') onPointer(e); });
face.addEventListener('dblclick', () => { S.happyT = S.happyT > .5 ? 0 : 1; }); // 笑顔の見た目確認用

/* ========= 起動 ========= */
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error(location.protocol === 'https:' ? 'このブラウザはカメラAPIに対応していません' : 'カメラは https:// で開いたページでのみ使えます');
  }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } } });
  cam.srcObject = stream;
  await new Promise(r => { if (cam.readyState >= 1) r(); else cam.onloadedmetadata = r; });
  await cam.play();
}
async function initLandmarker() {
  msgEl.textContent = '認識モデルを読み込んでいます…';
  const { FaceLandmarker, FilesetResolver } = await import(`${MP_BASE}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  const opts = { baseOptions: { modelAssetPath: MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true };
  try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts); }
  catch (e) { console.warn('GPU delegate failed, falling back to CPU', e); opts.baseOptions.delegate = 'CPU'; landmarker = await FaceLandmarker.createFromOptions(fileset, opts); }
}
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock) keepAwake(); });

$('#btnStart').addEventListener('click', async () => {
  $('#btnStart').disabled = true; msgEl.textContent = 'カメラを起動しています…';
  keepAwake();
  try {
    await startCamera();
    await initLandmarker();
    $('#start').hidden = true; log('追従開始'); setStatus('', '顔を探しています');
  } catch (e) {
    console.error(e);
    msgEl.textContent = `起動できませんでした: ${e.message || e}　→「カメラなしで試す」で目の動きだけ確認できます`;
    $('#btnStart').disabled = false;
  }
});
$('#btnTouchOnly').addEventListener('click', () => { $('#start').hidden = true; keepAwake(); S.touchUntil = performance.now() + 1500; setStatus('warn', 'タッチ操作中'); });

/* ========= コントロール ========= */
$('#btnDebug').addEventListener('click', e => { const d = $('#debug'); d.hidden = !d.hidden; e.currentTarget.classList.toggle('on', !d.hidden); store.set('debug', !d.hidden); });
$('#btnBlinkSync').addEventListener('click', e => { S.blinkSync = !S.blinkSync; e.currentTarget.classList.toggle('on', S.blinkSync); });
$('#btnTouch').addEventListener('click', () => { S.touchUntil = performance.now() + 4000; });
gainEl.addEventListener('input', () => store.set('gain', gainEl.value));
upBiasEl.addEventListener('input', () => store.set('upBias', upBiasEl.value));
gainEl.value = store.get('gain', gainEl.value); upBiasEl.value = store.get('upBias', upBiasEl.value);
if (store.get('debug', false)) { $('#debug').hidden = false; $('#btnDebug').classList.add('on'); }
S.nextBlink = performance.now() + 1500;
</script>
